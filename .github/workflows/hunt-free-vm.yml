name: Hunt OCI Always Free VM SDK

on:
  # schedule is added only after separately authorized real acceptance.
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Read-only OCI checks; never launch, notify or disable
        type: boolean
        default: false

permissions:
  actions: write

concurrency:
  group: oracle-free-vm-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Temporary diagnostic lock: all events are read-only until explicitly released.
      HUNT_DIAGNOSTIC_LOCK: 'false'
      HUNT_DIAGNOSTIC_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && 'true' || 'false' }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      AD_NAME: ${{ secrets.AD_NAME }}
      IMAGE_ID_ARM: ${{ secrets.IMAGE_ID_ARM }}
      IMAGE_ID_AMD: ${{ secrets.IMAGE_ID_AMD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check inventory and hunt one free VM
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json
          import logging
          import os
          import re
          import subprocess
          import sys
          import time
          import uuid

          REGION = 'ap-kulai-2'
          ARM = 'VM.Standard.A1.Flex'
          AMD = 'VM.Standard.E2.1.Micro'
          VALID = {'PROVISIONING', 'RUNNING', 'STARTING', 'STOPPING', 'STOPPED', 'MOVING'}
          started = time.monotonic()
          env = os.environ
          diagnostic_only = env.get('HUNT_DIAGNOSTIC_LOCK', 'true') != 'false' or env.get('HUNT_DIAGNOSTIC_ONLY', 'false') == 'true'
          stage = 'credentials'
          credential_step = None

          class Halt(Exception):
              pass

          class OciError(Exception):
              def __init__(self, status=None, code='', message='', category='sdk_error'):
                  self.status = status if type(status) is int and 100 <= status <= 599 else None
                  self.code, self.message, self.category = code, message, category
              
          def diagnostic_detail(error=None, category='validation_error'):
              # Only fixed labels and validated numeric HTTP status may leave this process.
              status = error.status if isinstance(error, OciError) else None
              if isinstance(error, OciError):
                  category = {401: 'authentication', 403: 'authorization', 429: 'rate_limit'}.get(
                      status, 'service_error' if status is not None else error.category)
                  if error.code == 'LimitExceeded':
                      category = 'quota'
              allowed = {'validation_error', 'sdk_error', 'timeout', 'transport', 'invalid_response',
                         'authentication', 'authorization', 'rate_limit', 'service_error',
                         'quota', 'runner_error', 'unknown_result',
                         'sdk_module_missing', 'sdk_dependency_missing', 'sdk_os_error',
                         'sdk_import_error', 'sdk_import_exception',
                         'private_key_passphrase', 'private_key_is_public', 'private_key_invalid',
                         'private_key_non_ascii', 'private_key_malformed', 'private_key_unknown',
                         'credential_field_fingerprint', 'credential_field_user', 'credential_field_tenancy',
                         'credential_field_unknown'}
              category = category if category in allowed else 'sdk_error'
              detail = 'stage=' + stage
              if stage == 'credentials' and credential_step is not None:
                  allowed_steps = {'sdk_import', 'retry_strategy', 'runtime_config', 'signer',
                                   'identity_client', 'compute_client', 'network_client', 'blockstorage_client'}
                  detail += ' credential_step=' + (credential_step if credential_step in allowed_steps else 'other')
              detail += ' category=' + category + ' http=' + (str(status) if status else 'none')
              return detail

          def need(condition, reason):
              if not condition:
                  raise Halt(reason)

          KEY_CATEGORIES = (('requires a passphrase', 'private_key_passphrase'),
                            ('authentication requires a private key', 'private_key_is_public'),
                            ('is not a private key', 'private_key_invalid'),
                            ('codec can\'t encode character', 'private_key_non_ascii'),
                            ('codec can\'t decode byte', 'private_key_non_ascii'),
                            ('could not deserialize key data', 'private_key_malformed'),
                            ('unable to load key', 'private_key_malformed'),
                            ('invalid private key', 'private_key_invalid'))

          def private_key_category(error):
              text = str(error).lower()
              return next((label for needle, label in KEY_CATEGORIES if needle in text), 'private_key_unknown')

          CREDENTIAL_FIELDS = ('fingerprint', 'user', 'tenancy')

          def credential_field_category(error):
              fields = error.errors if isinstance(getattr(error, 'errors', None), dict) else {}
              return next(('credential_field_' + field for field in CREDENTIAL_FIELDS if field in fields),
                          'credential_field_unknown')

          def http(url, method, headers=(), data=None):
              # Credentials go through stdin, never command arguments or logs.
              config = ['url = ' + json.dumps(url)]
              config += ['header = ' + json.dumps(h) for h in headers]
              if data is not None:
                  config.append('data = ' + json.dumps(json.dumps(data)))
              try:
                  result = subprocess.run(
                      ['curl', '--config', '-', '--silent', '--show-error',
                       '--request', method, '--connect-timeout', '10', '--max-time', '20',
                       '--write-out', '\n%{http_code}'],
                      input='\n'.join(config), text=True, capture_output=True, timeout=25)
                  body, status = result.stdout.rsplit('\n', 1)
                  return (int(status), body) if result.returncode == 0 else (0, '')
              except (OSError, ValueError, subprocess.TimeoutExpired):
                  return 0, ''

          def notify(message):
              if env.get('TG_BOT_TOKEN') and env.get('TG_CHAT_ID'):
                  status, body = http(
                      'https://api.telegram.org/bot' + env['TG_BOT_TOKEN'] + '/sendMessage', 'POST',
                      ['Content-Type: application/json'],
                      {'chat_id': env['TG_CHAT_ID'], 'text': 'OCI hunt SDK: ' + message})
                  try:
                      if status == 200 and json.loads(body).get('ok') is True:
                          return True
                  except (ValueError, AttributeError):
                      pass
              print('ERROR: Telegram delivery failed; inspect GitHub Actions and OCI manually.')
              return False

          def finish(message, success=False, detail=None):
              if diagnostic_only:
                  print('Diagnostic-only stopped: ' + ('category=existing_target' if success else (detail or diagnostic_detail())))
                  raise SystemExit(0 if success else 1)
              if not success:
                  detail = detail or diagnostic_detail()
                  print('OCI failure: ' + detail)
                  message += ' ' + detail
              # Notification failure must never prevent the bounded disable attempt.
              notified = notify(message)
              ref = env.get('GITHUB_WORKFLOW_REF', '')
              repo = env.get('GITHUB_REPOSITORY', '')
              match = re.fullmatch(re.escape(repo) + r'/\.github/workflows/([\w.-]+\.ya?ml)@.+', ref)
              disabled = False
              if match and env.get('GITHUB_TOKEN'):
                  status, _ = http(
                      'https://api.github.com/repos/' + repo + '/actions/workflows/' + match[1] + '/disable',
                      'PUT', ['Accept: application/vnd.github+json',
                              'Authorization: Bearer ' + env['GITHUB_TOKEN'],
                              'X-GitHub-Api-Version: 2022-11-28'])
                  disabled = status == 204
              if not disabled:
                  notify('自动禁用失败，请手动去 Actions 页 Disable workflow')
              print('Workflow disabled.' if disabled else 'ERROR: manually disable workflow in GitHub Actions.')
              raise SystemExit(0 if success and disabled and notified else 1)

          def query(label, method, **kwargs):
              global stage, credential_step
              stage = label
              credential_step = None
              try:
                  return method(retry_strategy=no_retry, **kwargs)
              except sdk.exceptions.ServiceError as error:
                  raise OciError(error.status, error.code, error.message) from None
              except sdk.exceptions.RequestException:
                  raise OciError(category='transport') from None
              except Exception:
                  raise OciError(category='invalid_response') from None

          def listing(label, method, **kwargs):
              # Use structured SDK collections; follow every next-page token, fail closed.
              rows, seen = [], set()
              while True:
                  response = query(label, method, **kwargs)
                  data = sdk.util.to_dict(response.data)
                  need(isinstance(data, list) and all(isinstance(x, dict) for x in data),
                       'Inventory response is invalid. Confirm configuration manually.')
                  rows.extend(data)
                  page = response.headers.get('opc-next-page')
                  if page is None:
                      return rows
                  need(isinstance(page, str) and bool(page) and page not in seen,
                       'Invalid or repeated pagination token. Confirm inventory manually.')
                  seen.add(page)
                  kwargs['page'] = page

          def get(label, method, **kwargs):
              data = sdk.util.to_dict(query(label, method, **kwargs).data)
              need(isinstance(data, dict), 'Invalid structured OCI response.')
              return data

          def inventory(compartment):
              rows = listing('target_instances' if compartment == env['OCI_COMPARTMENT_ID'] else 'other_instances',
                             compute.list_instances, compartment_id=compartment)
              need(all(isinstance(x.get('shape'), str) and isinstance(x.get('lifecycle_state'), str)
                       and x.get('id') for x in rows), 'Instance inventory is incomplete.')
              targets = [x for x in rows if x['shape'] in (ARM, AMD)]
              need(all(x['lifecycle_state'] in VALID | {'TERMINATING', 'TERMINATED'} for x in targets),
                   'Unknown instance state. Confirm inventory manually.')
              return targets

          def existing_target(targets):
              return next((x for x in targets if x['lifecycle_state'] != 'TERMINATED'), None)

          def target_message(target):
              # inventory() validates shape/state against fixed allowlists before notification.
              return ('Existing ' + target['shape'] + ' instance in ' + target['lifecycle_state']
                      + '; hunt target achieved; no additional instance created.')

          def check_target():
              target = existing_target(inventory(env['OCI_COMPARTMENT_ID']))
              if target:
                  finish(target_message(target), success=True)

          def validate_image(image, shape):
              name = image.get('display_name', '')
              need(image.get('compartment_id') is None
                   and image.get('operating_system') == 'Canonical Ubuntu'
                   and image.get('operating_system_version') in ('24.04', '24.04 Minimal')
                   and image.get('lifecycle_state') == 'AVAILABLE'
                   and re.fullmatch(r'Canonical-Ubuntu-24\.04(?:-Minimal)?(?:-aarch64)?-\d{4}\.\d{2}\.\d{2}-\d+', name)
                   and ('-aarch64-' in name) == (shape == ARM)
                   and isinstance(image.get('size_in_mbs'), int)
                   and 0 < image['size_in_mbs'] <= 50 * 1024
                   and isinstance(image.get('id'), str)
                   and image['id'].startswith('ocid1.image.oc1.' + REGION + '.'),
                   'Cannot confirm a free Ubuntu 24.04 platform image within a 50 GB boot disk. Confirm manually.')
              return image['id']

          def image_for(shape):
              global stage
              stage = 'image_arm' if shape == ARM else 'image_amd'
              override = env.get('IMAGE_ID_ARM' if shape == ARM else 'IMAGE_ID_AMD')
              if override:
                  image = get(stage, compute.get_image, image_id=override)
                  need(isinstance(image, dict), 'Invalid image response.')
                  image_id = validate_image(image, shape)
                  need(image_id == override, 'Image override response does not match.')
                  stage = 'image_compat_arm' if shape == ARM else 'image_compat_amd'
                  entry = get(stage, compute.get_image_shape_compatibility_entry,
                              image_id=image_id, shape_name=shape)
                  need(isinstance(entry, dict) and entry.get('image_id') == image_id
                       and entry.get('shape') == shape, 'Image override is not shape-compatible.')
                  return image_id
              images = listing(stage, compute.list_images, compartment_id=env['OCI_COMPARTMENT_ID'],
                               operating_system='Canonical Ubuntu', shape=shape,
                               sort_by='TIMECREATED', sort_order='DESC')
              for image in images:
                  try:
                      return validate_image(image, shape)
                  except Halt:
                      continue
              raise Halt('No verified free Ubuntu 24.04 image for this shape. Confirm manually.')

          def preflight():
              subscriptions = listing('region_subscription', identity.list_region_subscriptions, tenancy_id=env['OCI_CLI_TENANCY'])
              homes = [x.get('region_name') for x in subscriptions if x.get('is_home_region') is True]
              need(homes == [REGION], 'ap-kulai-2 must be the tenancy home region. Confirm free eligibility manually.')
              domains = listing('availability_domains', identity.list_availability_domains, compartment_id=env['OCI_CLI_TENANCY'])
              ads = [x.get('name') for x in domains]
              need(ads and all(isinstance(ad, str) and 'AP-KULAI-2-AD-' in ad for ad in ads),
                   'Availability domains could not be verified.')
              subnet = get('subnet', network.get_subnet, subnet_id=env['OCI_SUBNET_ID'])
              need(isinstance(subnet, dict) and subnet.get('id') == env['OCI_SUBNET_ID']
                   and subnet.get('lifecycle_state') == 'AVAILABLE', 'Subnet could not be verified.')
              need(subnet.get('prohibit_public_ip_on_vnic') is False,
                   'Subnet does not explicitly allow public IP assignment. Check subnet configuration manually.')
              subnet_ad = subnet.get('availability_domain')
              chosen = env.get('AD_NAME') or subnet_ad
              need(not chosen or chosen in ads, 'AD_NAME or subnet AD is outside ap-kulai-2.')
              need(not subnet_ad or not chosen or subnet_ad == chosen, 'Subnet and AD_NAME disagree.')
              compartments = listing('compartments', identity.list_compartments,
                                     compartment_id=env['OCI_CLI_TENANCY'],
                                     compartment_id_in_subtree=True, access_level='ANY')
              need(all(x.get('id') and x.get('lifecycle_state') in ('ACTIVE', 'DELETED') for x in compartments),
                   'Cannot verify tenancy compartment inventory.')
              ids = {env['OCI_CLI_TENANCY']} | {x['id'] for x in compartments if x['lifecycle_state'] == 'ACTIVE'}
              need(env['OCI_COMPARTMENT_ID'] in ids, 'Target compartment is not active in this tenancy.')
              storage = 0
              for compartment in sorted(ids):
                  if compartment != env['OCI_COMPARTMENT_ID']:
                      need(all(x['lifecycle_state'] == 'TERMINATED' for x in inventory(compartment)),
                           'A1/E2 exists in another compartment. Confirm tenancy free quota manually.')
                  volumes = listing('block_volumes', storage_client.list_volumes, compartment_id=compartment)
                  for ad in ads:
                      volumes += listing('boot_volumes', storage_client.list_boot_volumes, compartment_id=compartment,
                                         availability_domain=ad)
                  for volume in volumes:
                      if volume.get('lifecycle_state') == 'TERMINATED':
                          continue
                      need(volume.get('lifecycle_state') in ('AVAILABLE', 'PROVISIONING', 'RESTORING', 'TERMINATING', 'FAULTY')
                           and isinstance(volume.get('size_in_gbs'), int) and volume['size_in_gbs'] > 0,
                           'Cannot confirm free storage capacity. Confirm manually.')
                      storage += volume['size_in_gbs']
              need(storage + 50 <= 200, 'Insufficient free tenancy storage for a 50 GB boot disk. Confirm manually.')
              return chosen or sorted(ads)[0]

          def reconcile():
              # A failed/partial launch may already have been accepted. Never launch again.
              detail = None
              try:
                  target = existing_target(inventory(env['OCI_COMPARTMENT_ID']))
                  if target:
                      finish(target_message(target), success=True)
              except (OciError, Halt) as error:
                  detail = diagnostic_detail(error)
              finish('Launch outcome unknown. Check OCI instances and boot volumes manually before re-enabling.',
                     detail=detail or diagnostic_detail(category='unknown_result'))

          def hunt(ad):
              global stage
              for shape in (ARM, AMD):
                  # Resolve AMD only after an unambiguous ARM capacity rejection.
                  image_id = image_for(shape)
                  need(ad == preflight(), 'AD configuration changed during this run. Confirm manually.')
                  check_target()
                  need(time.monotonic() - started < 900, 'Run budget exhausted before creation. Check manually.')
                  need(not diagnostic_only, 'Diagnostic mode forbids creation.')
                  details = sdk.core.models.LaunchInstanceDetails(
                      compartment_id=env['OCI_COMPARTMENT_ID'], availability_domain=ad,
                      shape=shape, display_name='always-free-sdk', capacity_reservation_id='',
                      create_vnic_details=sdk.core.models.CreateVnicDetails(
                          subnet_id=env['OCI_SUBNET_ID'], assign_public_ip=True),
                      source_details=sdk.core.models.InstanceSourceViaImageDetails(
                          image_id=image_id, boot_volume_size_in_gbs=50, boot_volume_vpus_per_gb=10),
                      metadata={'ssh_authorized_keys': env['SSH_PUBLIC_KEY'].strip()},
                      shape_config=(sdk.core.models.LaunchInstanceShapeConfigDetails(ocpus=2, memory_in_gbs=12)
                                    if shape == ARM else None))
                  stage = 'launch_arm' if shape == ARM else 'launch_amd'
                  try:
                      response = query(stage, compute.launch_instance, launch_instance_details=details,
                                       opc_retry_token=str(uuid.uuid4()))
                      result = sdk.util.to_dict(response.data)
                  except OciError as error:
                      if error.status == 429:
                          print('Round stopped: stage=' + stage + ' category=rate_limit http=429')
                          return
                      if error.status == 500 and error.code == 'InternalError' and isinstance(error.message, str) \
                              and error.message.strip().lower().rstrip('.') == 'out of host capacity':
                          continue
                      if error.status in (400, 401, 403, 404, 409, 422) or error.code == 'LimitExceeded':
                          finish('OCI rejected creation. Check IAM, quota and configuration before re-enabling.',
                                 detail=diagnostic_detail(error))
                      reconcile()
                  else:
                      if isinstance(result, dict) and result.get('id') \
                              and result.get('shape') == shape and result.get('lifecycle_state') in VALID:
                          finish('Created ' + ('ARM 2 OCPU / 12 GB' if shape == ARM else 'AMD Micro fallback')
                                 + ' with a 50 GB boot disk; no further creation.', success=True)
                      reconcile()
              print('Round complete: category=capacity_unavailable; ARM and AMD rejected; no instance accepted.')

          try:
              need(env.get('HUNT_DIAGNOSTIC_ONLY', 'false') in ('true', 'false'), 'Invalid execution mode.')
              required = ('OCI_CLI_TENANCY', 'OCI_CLI_USER', 'OCI_CLI_FINGERPRINT', 'OCI_CLI_KEY_CONTENT',
                          'OCI_COMPARTMENT_ID', 'OCI_SUBNET_ID', 'SSH_PUBLIC_KEY', 'TG_BOT_TOKEN', 'TG_CHAT_ID',
                          'GITHUB_TOKEN', 'GITHUB_REPOSITORY', 'GITHUB_WORKFLOW_REF')
              need(all(env.get(key, '').strip() for key in required), 'Required Secrets or GitHub context missing.')
              need(re.fullmatch(r'[\w.-]+/[\w.-]+', env['GITHUB_REPOSITORY'])
                   and re.fullmatch(re.escape(env['GITHUB_REPOSITORY'])
                       + r'/\.github/workflows/[\w.-]+\.ya?ml@.+', env['GITHUB_WORKFLOW_REF']),
                   'Cannot identify the current GitHub workflow for automatic disable.')
              need(all('\n' not in env[key] and '\r' not in env[key]
                       for key in required if key not in ('OCI_CLI_KEY_CONTENT', 'SSH_PUBLIC_KEY')),
                   'Invalid credential format. Check Secrets manually.')
              need(re.fullmatch(r'(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(?:256|384|521)) [A-Za-z0-9+/=]+(?: [^\r\n]*)?',
                                env['SSH_PUBLIC_KEY'].strip()), 'SSH_PUBLIC_KEY must contain one public key.')
              # Install before importing SDK; never print installer or SDK exception bodies.
              stage = 'sdk_install'
              try:
                  install = subprocess.run([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check',
                                            'oci==2.187.2'], capture_output=True, text=True, timeout=180)
              except subprocess.TimeoutExpired:
                  raise OciError(category='timeout') from None
              except OSError:
                  raise OciError(category='transport') from None
              need(install.returncode == 0, 'OCI SDK installation failed. Inspect runner dependencies manually.')
              import site
              import importlib
              site.addsitedir(site.getusersitepackages())
              if hasattr(site, 'getsitepackages'):
                  for p in site.getsitepackages():
                      site.addsitedir(p)
              importlib.invalidate_caches()
              stage = 'credentials'
              credential_step = 'sdk_import'
              try:
                  import oci as sdk
              except ModuleNotFoundError as error:
                  category = 'sdk_module_missing' if error.name == 'oci' else 'sdk_dependency_missing'
                  raise OciError(category=category) from None
              except OSError:
                  raise OciError(category='sdk_os_error') from None
              except ImportError:
                  raise OciError(category='sdk_import_error') from None
              except Exception:
                  raise OciError(category='sdk_import_exception') from None
              credential_step = 'retry_strategy'
              no_retry = sdk.retry.NoneRetryStrategy()
              # No ~/.oci/config and no credential files. Signer consumes the runtime Secret in memory.
              credential_step = 'runtime_config'
              logging.disable(logging.CRITICAL)
              # SDK 2.187.2 has a separate header-parser retry loop: explicitly disable it too.
              env['OCI_HEADER_PARSING_ERROR_MAX_RETRIES'] = '0'
              config = dict(region=REGION, log_requests=False,
                            tenancy=env['OCI_CLI_TENANCY'], user=env['OCI_CLI_USER'],
                            fingerprint=env['OCI_CLI_FINGERPRINT'], key_content=env.pop('OCI_CLI_KEY_CONTENT'))
              credential_step = 'signer'
              try:
                  signer = sdk.signer.Signer(config['tenancy'], config['user'], config['fingerprint'],
                                             None, private_key_content=config['key_content'])
              except Exception as error:
                  raise OciError(category=private_key_category(error)) from None
              options = dict(signer=signer, retry_strategy=no_retry, timeout=(10, 30))
              # Client construction validates user/tenancy/fingerprint shape; label failures by field name.
              try:
                  credential_step = 'identity_client'
                  identity = sdk.identity.IdentityClient(config, **options)
                  credential_step = 'compute_client'
                  compute = sdk.core.ComputeClient(config, **options)
                  credential_step = 'network_client'
                  network = sdk.core.VirtualNetworkClient(config, **options)
                  credential_step = 'blockstorage_client'
                  storage_client = sdk.core.BlockstorageClient(config, **options)
              except sdk.exceptions.InvalidConfig as error:
                  raise OciError(category=credential_field_category(error)) from None
              stage = 'target_check'
              credential_step = None
              check_target()
              ad = preflight()
              if diagnostic_only:
                  image_for(ARM)
                  image_for(AMD)
                  print('Diagnostic-only complete: category=checks_passed; no launch, notification or disable.')
                  raise SystemExit(0)
              hunt(ad)
          except OciError as error:
              # Ordinary query throttling stops this round silently; reconcile() handles uncertain launches separately.
              if diagnostic_only or error.status != 429:
                  finish('OCI inventory, image or preflight query failed. No further creation; check permissions/configuration.',
                         detail=diagnostic_detail(error))
          except Halt as error:
              finish(str(error))
          except Exception:
              finish('Unexpected runner error. Check OCI manually before re-enabling; no further creation.',
                     detail=diagnostic_detail(category='runner_error'))
          PY
